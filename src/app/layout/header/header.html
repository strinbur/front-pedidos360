<header class="header">
  <div class="header__brand">
    <span class="header__logo">Pedidos360</span>
  </div>

  <div class="header__actions">

    <!-- Ícono de usuario con dropdown -->
    <div class="header__user" (mouseenter)="isUserMenuOpen.set(true)">
      <button
        class="header__icon-btn"
        type="button"
        (click)="toggleUserMenu()"
        aria-label="Cuenta de usuario"
      >
        <svg viewBox="0 0 24 24" class="header__icon">
          <path d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12zm0 2.2c-3.3 0-9.8 1.6-9.8 4.9v2.7h19.6v-2.7c0-3.3-6.5-4.9-9.8-4.9z"/>
        </svg>
      </button>

      @if (isUserMenuOpen()) {
        <div class="header__dropdown">
          <a routerLink="/auth/login" class="header__dropdown-item">Iniciar sesión</a>
          <a routerLink="/auth/register" class="header__dropdown-item">Registrarse</a>
        </div>
      }
    </div>

    <!-- Ícono de carrito con badge -->
    <button class="header__icon-btn header__cart" type="button" aria-label="Carrito de compras">
      <svg viewBox="0 0 24 24" class="header__icon">
        <path d="M7 4h-2l-1 2v1h2l3.6 7.6-1.4 2.4a1 1 0 0 0 1 1.5h9v-2h-8.4l1-2h6.4a1 1 0 0 0 .9-.6l3-6.4h-14z"/>
      </svg>

      @if (cartCount() > 0) {
        <span class="header__cart-badge">{{ cartCount() }}</span>
      }
    </button>

  </div>
</header>
