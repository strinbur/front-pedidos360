<header class="header">
  <div class="header__inner">

    <a routerLink="/" class="header__brand">
      <span class="header__logo">
        <span class="header__logo-main">Pedidos</span><span class="header__logo-accent">360</span>
      </span>
    </a>

    <!-- Navegación principal -->
    <nav class="header__nav">
      <a routerLink="/products" routerLinkActive="header__nav-link--active" class="header__nav-link">
        Productos
      </a>
      @if (isAdmin()) {
        <a routerLink="/dashboard" routerLinkActive="header__nav-link--active" class="header__nav-link">
          Dashboard
        </a>
      }
    </nav>

    <div class="header__actions">

      <!-- Usuario con dropdown -->
      <div class="header__user">
        <button
          class="header__icon-btn"
          type="button"
          (click)="toggleUserMenu()"
          [attr.aria-expanded]="isUserMenuOpen()"
          aria-label="Cuenta de usuario"
        >
          @if (isLoggedIn()) {
            <span class="header__avatar">{{ userInitial() }}</span>
          } @else {
            <app-icon name="user" [size]="20"></app-icon>
            <span class="header__icon-btn-label">Cuenta</span>
          }
          <app-icon name="chevron-down" [size]="14" class="header__chevron"></app-icon>
        </button>

        @if (isUserMenuOpen()) {
          <div class="header__dropdown">
            <div class="header__dropdown-inner">
              @if (isLoggedIn()) {
                <div class="header__dropdown-user">
                  <span class="header__dropdown-user-name">{{ userName() }}</span>
                </div>
                <button type="button" class="header__dropdown-item header__dropdown-item--button" (click)="logout()">
                  Cerrar sesión
                </button>
              } @else {
                <a routerLink="/auth/login" class="header__dropdown-item" (click)="isUserMenuOpen.set(false)">Iniciar sesión</a>
                <a routerLink="/auth/register" class="header__dropdown-item" (click)="isUserMenuOpen.set(false)">Registrarse</a>
              }
            </div>
          </div>
        }
      </div>

      <!-- Separador -->
      <span class="header__divider"></span>

      <!-- Carrito -->
      <a routerLink="/cart" class="header__icon-btn header__cart" aria-label="Carrito de compras">
        <app-icon name="cart" [size]="20"></app-icon>
        @if (cartCount() > 0) {
          <span class="header__cart-badge">{{ cartCount() }}</span>
        }
      </a>

    </div>
  </div>
</header>
